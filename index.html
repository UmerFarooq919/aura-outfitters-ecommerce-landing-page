<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura E-Commerce landing Page</title>
</head>
<body>
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-neutral-200/80 transition-all">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    
     <!-- Logo -->
    <a href="#" class="text-2xl font-black tracking-widest uppercase text-neutral-900 hover:opacity-80 transition">
      AURA<span class="text-neutral-400 font-light ml-1">OUTFITTERS</span>
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-600">
      <a href="#home" class="hover:text-neutral-900 transition">Home</a>
      <a href="#shop" class="text-neutral-900 font-semibold border-b-2 border-neutral-900 pb-1">Shop</a>
      <a href="#collections" class="hover:text-neutral-900 transition">Collections</a>
      <a href="#about" class="hover:text-neutral-900 transition">About</a>
      <a href="#journal" class="hover:text-neutral-900 transition">Journal</a>
    </nav>
    </div>
    <!-- Right Icons  -->
    <div class="flex items-center gap-5">
      <!-- Search Button -->
      <button class="p-2 text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 rounded-full transition" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
    <!-- Profile Button -->
      <button class="p-2 text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 rounded-full transition" aria-label="Account">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </button>
      <!-- Cart Button -->
      <button id="cart-btn" class="relative p-2 text-neutral-700 hover:text-neutral-900 hover:bg-neutral-100 rounded-full transition" aria-label="Shopping Cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        <span class="absolute top-1 right-1 bg-neutral-900 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
          2
        </span>
      </button>
    </div>
</header>
<!-- ================= SECTION 2: HERO BANNER ================= -->
<section class="relative bg-neutral-100 py-12 md:py-16">
  <div class="max-w-7xl mx-auto px-6">
    <div class="relative overflow-hidden rounded-2xl bg-neutral-200 min-h-[420px] md:min-h-[480px] flex items-center p-8 md:p-16">
      <!-- Background Image -->
      <div class="absolute inset-0 z-0">
        <img 
          src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?q=80&w=1600&auto=format&fit=crop" 
          alt="Aura Outfitters Premium Collection" 
          class="w-full h-full object-cover object-center opacity-90"/>
          <div class="absolute inset-0 bg-gradient-to-r from-neutral-900/70 via-neutral-900/40 to-transparent"></div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
